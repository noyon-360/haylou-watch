<svg xmlns='http://www.w3.org/2000/svg' width='1150' height='450' viewBox='0 0 1150 450' font-family='Manrope, Segoe UI, Helvetica, Arial, sans-serif'><rect width='1150' height='450' rx='18' fill='#F8F6EE'/><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#6E715E'/></marker></defs><text x='40' y='52' font-size='24' font-weight='800' fill='#23261A'>From a closed app to an open one</text><text x='40' y='80' font-size='15' fill='#6E715E'>The eight steps of this project, in order</text><rect x='40' y='115' width='250' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><circle cx='78' cy='159' r='20' fill='#A9512C'/><text x='78' y='166' font-size='18' font-weight='800' fill='#fff' text-anchor='middle'>1</text><text x='110' y='167' font-size='20' font-weight='800' fill='#23261A'>APKTool</text><text x='62' y='207' font-size='15' fill='#6E715E'>decompile the official app</text><path d='M294 175 h18' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='320' y='115' width='250' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><circle cx='358' cy='159' r='20' fill='#2F6070'/><text x='358' y='166' font-size='18' font-weight='800' fill='#fff' text-anchor='middle'>2</text><text x='390' y='167' font-size='20' font-weight='800' fill='#23261A'>HCI snoop log</text><text x='342' y='207' font-size='15' fill='#6E715E'>record real BLE traffic</text><path d='M574 175 h18' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='600' y='115' width='250' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><circle cx='638' cy='159' r='20' fill='#3C6E9F'/><text x='638' y='166' font-size='18' font-weight='800' fill='#fff' text-anchor='middle'>3</text><text x='670' y='167' font-size='20' font-weight='800' fill='#23261A'>Wireshark</text><text x='622' y='207' font-size='15' fill='#6E715E'>decode ATT frames</text><path d='M854 175 h18' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='880' y='115' width='250' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><circle cx='918' cy='159' r='20' fill='#A9473B'/><text x='918' y='166' font-size='18' font-weight='800' fill='#fff' text-anchor='middle'>4</text><text x='950' y='167' font-size='20' font-weight='800' fill='#23261A'>Burp Suite</text><text x='902' y='207' font-size='15' fill='#6E715E'>check its network calls</text><path d='M1005.0 239 v62' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='880' y='305' width='250' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><circle cx='918' cy='349' r='20' fill='#4F5D75'/><text x='918' y='356' font-size='18' font-weight='800' fill='#fff' text-anchor='middle'>5</text><text x='950' y='357' font-size='20' font-weight='800' fill='#23261A'>Plan</text><text x='902' y='397' font-size='15' fill='#6E715E'>CLAUDE.md blueprint</text><path d='M876 365 h-18' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='600' y='305' width='250' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><circle cx='638' cy='349' r='20' fill='#5B8C6A'/><text x='638' y='356' font-size='18' font-weight='800' fill='#fff' text-anchor='middle'>6</text><text x='670' y='357' font-size='20' font-weight='800' fill='#23261A'>Figma UI</text><text x='622' y='397' font-size='15' fill='#6E715E'>18 screens, 6 seasons</text><path d='M596 365 h-18' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='320' y='305' width='250' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><circle cx='358' cy='349' r='20' fill='#C29A3C'/><text x='358' y='356' font-size='18' font-weight='800' fill='#fff' text-anchor='middle'>7</text><text x='390' y='357' font-size='20' font-weight='800' fill='#23261A'>Logo</text><text x='342' y='397' font-size='15' fill='#6E715E'>Keyhole Face</text><path d='M316 365 h-18' stroke='#6E715E