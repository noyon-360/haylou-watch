<svg xmlns='http://www.w3.org/2000/svg' width='1040' height='260' viewBox='0 0 1040 260' font-family='Manrope, Segoe UI, Helvetica, Arial, sans-serif'><rect width='1040' height='260' rx='18' fill='#F8F6EE'/><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#6E715E'/></marker></defs><text x='40' y='52' font-size='24' font-weight='800' fill='#23261A'>Burp Suite interception setup</text><text x='40' y='80' font-size='15' fill='#6E715E'>start-burp-emulator.sh + inject_ca.sh (re-run after every cold boot: the CA mount is tmpfs)</text><rect x='40' y='110' width='210' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><text x='60' y='148' font-size='19' font-weight='800' fill='#23261A'>Rooted AVD</text><text x='60' y='180' font-size='14' fill='#6E715E'>Pixel emulator,</text><text x='60' y='202' font-size='14' fill='#6E715E'>writable /system</text><path d='M254 170 h30' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='290' y='110' width='210' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><text x='310' y='148' font-size='19' font-weight='800' fill='#23261A'>Burp CA</text><text x='310' y='180' font-size='14' fill='#6E715E'>injected into the</text><text x='310' y='202' font-size='14' fill='#6E715E'>system trust store</text><path d='M504 170 h30' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='540' y='110' width='210' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><text x='560' y='148' font-size='19' font-weight='800' fill='#23261A'>Proxy</text><text x='560' y='180' font-size='14' fill='#6E715E'>http_proxy =</text><text x='560' y='202' font-size='14' fill='#6E715E'>10.0.2.2:8080</text><path d='M754 170 h30' stroke='#6E715E' stroke-width='2.5' marker-end='url(#a)'/><rect x='790' y='110' width='210' height='120' rx='16' fill='#FFFFFF' stroke='#E2DECB' stroke-width='2'/><text x='810' y='148' font-size='19' font-weight='800' fill='#23261A'>Burp Suite</text><text x='810' y='180' font-size='14' fill='#6E715E'>HTTP history of the</text><text x='810' y='202' font-size='14' fill='#6E715E'>official app</text></svg>